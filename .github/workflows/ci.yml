name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install "cryptography>=46" "numpy>=2" "pytest>=9" "ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
